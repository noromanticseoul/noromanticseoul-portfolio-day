    if (edit) {
      const byArea = Object.fromEntries((P.contrib || []).map(r => [r.area, r]));
      return `<h4>역할 · 기여도</h4><dl class="kv"><dt>직책</dt><dd><input type="text" data-f="leader" data-p="${pid}" value="${esc(P.leader)}" placeholder="리더였을 때만 (예: 조장, 프로젝트 매니저)"></dd></dl>
        <table class="share"><tbody>${AREAS.map(a => { const r = byArea[a] || {}; return `<tr><td class="a">${a}</td><td class="p"><input type="text" inputmode="numeric" data-f="pct" data-a="${a}" data-p="${pid}" value="${esc(r.pct)}" aria-label="${a} %"></td><td class="d"><input type="text" data-f="detail" data-a="${a}" data-p="${pid}" value="${esc(r.detail)}" aria-label="${a} 한 일"></td></tr>`; }).join("")}</tbody></table>
        <p class="savestate" id="ss-${pid}"></p>`;
    }
    return `<h4>역할 · 기여도</h4>${P.leader ? `<dl class="kv"><dt>직책</dt><dd>${esc(P.leader)}</dd></dl>` : ""}
      ${rows.length ? `<table class="share"><tbody>${rows.map(r => `<tr><td class="a">${esc(r.area)}</td><td class="p">${r.pct ? esc(r.pct) + "%" : "—"}</td><td class="d">${esc(r.detail)}</td></tr>`).join("")}</tbody></table>`
        : `<p class="solo">각 영역의 기여도는 리뷰 당일 설명드리겠습니다.</p>`}
      <p class="savestate" style="margin-top:10px">각 %는 해당 영역에서의 본인 참여 비율이며, 팀원 합산은 100%를 넘지 않습니다.</p>`;
  }

  function galleryHTML(secs, kind, pid) {
    const nonEmpty = (secs || []).filter(s => s.items && s.items.length);
    if (!nonEmpty.length) return edit && kind === "process" ? `<div class="gal-h"><h3>프로세스</h3></div><div class="empty">프로세스 자료를 보내 주시면 여기에 들어갑니다.</div>` : "";
    const total = nonEmpty.reduce((a, s) => a + s.items.length, 0);
    return `<div class="gal-h"><h3>${kind === "media" ? "결과물" : kind === "deck" ? "발표 자료" : "프로세스"}</h3><span>${total}장 · 옆으로 넘겨 보기</span></div>` +
      nonEmpty.map((s, si) => `<div class="sec-label">${esc(s.label)}</div><div class="gal${s.items.length === 1 ? " single" : ""}">${s.items.map((it, ii) =>
        it.t === "video" ? `<figure><video src="${esc(it.src)}" ${it.poster ? `poster="${esc(it.poster)}"` : ""} ${it.loop ? "autoplay muted loop playsinline" : "controls playsinline preload=\"metadata\""}></video>${it.cap ? `<figcaption>${esc(it.cap)}</figcaption>` : ""}</figure>`
        : `<figure><img src="${esc(it.src)}" alt="${esc(s.label)} ${ii + 1}" loading="lazy" decoding="async" data-g="${pid}|${kind}|${si}" data-i="${ii}">${it.cap ? `<figcaption>${esc(it.cap)}</figcaption>` : ""}</figure>`).join("")}</div>`).join("");
  }

  function renderCourse(c) {
    const ch = String(chapterOf(c.id)).padStart(2, "0");
    let h = `<header class="course"><div class="eyebrow">CH.${ch} · ${esc(c.sem)} · ${esc(c.en)}</div>
      <h1>${esc(c.ko)}<span class="track">${TRACK[c.track]} 포트폴리오</span></h1>${c.note ? `<p class="lede">${esc(c.note)}</p>` : ""}</header>`;
    if (c.flow && c.flow.length) h += `<section class="flow" aria-label="프로세스 다이어그램"><h3>프로세스 다이어그램<span>이 수업에서 작업한 순서</span></h3><ol>${c.flow.map((f, i) => `<li><div class="dot"><b>${i + 1}</b><i></i></div><div class="t">${esc(f.t)}</div><div class="d">${esc(f.d)}</div></li>`).join("")}</ol></section>`;
    if (c.deck && c.deck.items.length) h += `<section class="card" style="padding:18px 20px">${galleryHTML([c.deck], "deck", c.id + "-deck")}</section>`;
    c.projects.forEach((p, i) => {
      const P = proj(p), pid = p.id, n = String(i + 1).padStart(2, "0");
      const hasMedia = (p.media || []).some(s => s.items.length);
      h += `<section class="project" id="${pid}">
        <div class="mark"><span class="ch">CH.${ch}-${n}</span><span>${esc(SHORT[c.ko] || c.ko)} · ${esc((p.fields || []).join(" · "))}</span></div>
        <h2>${esc(p.title)}</h2><p class="sub">${esc(p.sub)}</p>
        ${p.team && !p.solo ? `<div class="team">${p.team.split(" · ").map((x, k) => k < 2 ? `<span>${esc(x)}</span>` : `<b>${esc(x)}</b>`).join("")}</div>` : `<div class="team"><span>${esc(p.team)}</span></div>`}
        <div class="card desc${edit ? " edit" : ""}"><div><h4>소개</h4>${edit ? `<textarea data-f="intro" data-p="${pid}">${esc(P.intro)}</textarea>${p.solo ? `<label style="display:block;margin-top:10px;font-size:13px;color:var(--faint)">의뢰한 개인·단체 (비교과만)<input type="text" data-f="client" data-p="${pid}" value="${esc(P.client)}"></label><p class="savestate" id="ss-${pid}"></p>` : ""}`
          : (P.intro ? `<p>${esc(P.intro)}</p>` : `<p class="solo">소개 글 준비 중입니다.</p>`)}
          ${p.game ? `<a class="linkbtn" href="${esc(p.game)}" target="_blank" rel="noopener">직접 만든 게임 플레이하기 ↗</a>` : ""}
          ${(p.links || []).length ? `<div class="links">${p.links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} <span>↗</span></a>`).join("")}</div>` : ""}</div>
          <div>${shareHTML(p, pid)}</div></div>
        ${hasMedia ? galleryHTML(p.media, "media", pid) : (edit && !(p.links || []).length ? `<div class="gal-h"><h3>결과물</h3></div><div class="empty">결과물 이미지를 정리해 주시면 여기에 들어갑니다.</div>` : "")}
        ${p.noprocess ? "" : galleryHTML(p.process, "process", pid)}
      </section>`;
    });
    return h;
  }

  function renderAbout() {
    const sw = swEdit || SW0;
    const fields = {};
    DATA.forEach((c, ci) => c.projects.forEach((p, pi) => (p.fields || ["기타"]).forEach(f => (fields[f] = fields[f] || []).push({ c, p, ci, pi }))));
    return `<header class="course"><div class="eyebrow">CONTENTS · SOFTWARE</div><h1>분야별 목차와<br>소프트웨어</h1>
      <p class="lede">최근 학기 수업부터 배치했습니다. 위의 과목 탭에서 수업별로, 아래 목차에서 분야별로 작업을 볼 수 있습니다.</p></header>
      <section class="project" style="border-top:0"><h2 style="font-size:26px">분야별 목차</h2><div class="toc" style="margin-top:16px">
      ${Object.entries(fields).map(([f, list]) => `<div class="card"><h4>${esc(f)}</h4>${list.map(({ c, p, ci, pi }) => `<a href="#${p.id}" data-jump="${c.id}|${p.id}"><span>${esc(p.title)}</span><small>CH.${String(ci + 1).padStart(2, "0")}-${String(pi + 1).padStart(2, "0")} · ${esc(SHORT[c.ko] || c.ko)}</small></a>`).join("")}</div>`).join("")}
      </div></section>
      <section class="project"><h2 style="font-size:26px">주요 소프트웨어 교육 이력과 수준</h2><div class="card${edit ? " edit" : ""}" style="overflow-x:auto"><table class="sw"><thead><tr><th style="width:30%">소프트웨어</th><th style="width:72px">수준</th><th>교육 이력 / 주요 사용</th></tr></thead><tbody>
      ${Object.entries(sw).map(([n, v]) => edit
        ? `<tr><td><b>${esc(n)}</b></td><td><input type="text" data-sw="${esc(n)}" data-k="level" value="${esc(v.level)}" placeholder="상·중·하"></td><td><input type="text" data-sw="${esc(n)}" data-k="history" value="${esc(v.history)}"></td></tr>`
        : `<tr><td><b>${esc(n)}</b></td><td class="lv">${esc(v.level || "")}</td><td>${esc(v.history || "")}</td></tr>`).join("")}
      </tbody></table><p class="savestate" id="ss-sw"></p></div></section>`;
  }

  function render(keepScroll) {
    renderNav();
    const c = DATA.find(x => x.id === view);
    const y = window.scrollY;
    $("#view").innerHTML = c ? renderCourse(c) : renderAbout();
    if (keepScroll) window.scrollTo(0, y);
  }
  function goCourse(cid, pid) {
    view = cid; render();
    try { history.replaceState(null, "", "#" + (pid || cid)); } catch (e) {}
    if (pid) { const el = document.getElementById(pid); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
    const b = document.querySelector(`#courses [data-c="${cid}"]`); if (b && b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "center" });
  }

  // lightbox
  let lb = null;
  function openLB(key, i) {
    const [pid, kind, si] = key.split("|");
    let secs;
    if (kind === "deck") secs = [DATA.find(c => c.id + "-deck" === pid).deck];
    else { const p = DATA.flatMap(c => c.projects).find(x => x.id === pid); secs = (kind === "media" ? p.media : p.process).filter(s => s.items.length); }
    const items = secs[+si].items.filter(x => x.t === "img");
    lb = { items, i: +i };
    const el = document.createElement("div"); el.className = "lb"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "크게 보기");
    el.innerHTML = `<img alt=""><button class="x" type="button" aria-label="닫기">×</button><button class="pv" type="button" aria-label="이전">‹</button><button class="nx" type="button" aria-label="다음">›</button><div class="cnt"></div>`;
    document.body.appendChild(el); lb.el = el; showLB();
    el.addEventListener("click", e => { if (e.target === el || e.target.classList.contains("x")) closeLB(); else if (e.target.classList.contains("pv")) stepLB(-1); else if (e.target.classList.contains("nx")) stepLB(1); });
    $(".x", el).focus();
  }
  function showLB() { $("img", lb.el).src = lb.items[lb.i].src; $(".cnt", lb.el).textContent = `${lb.i + 1} / ${lb.items.length}`; }
  function stepLB(d) { lb.i = (lb.i + d + lb.items.length) % lb.items.length; showLB(); }
  function closeLB() { if (lb) { lb.el.remove(); lb = null; } }
  document.addEventListener("keydown", e => { if (!lb) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowRight") stepLB(1); if (e.key === "ArrowLeft") stepLB(-1); });

  document.addEventListener("click", e => {
    const c = e.target.closest("[data-c]"); if (c) { goCourse(c.dataset.c); return; }
    const p = e.target.closest("[data-p]"); if (p && p.tagName === "BUTTON") { const el = document.getElementById(p.dataset.p); if (el) el.scrollIntoView(); try { history.replaceState(null, "", "#" + p.dataset.p); } catch (_) {} return; }
    const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); const [cid, pid] = j.dataset.jump.split("|"); goCourse(cid, pid); return; }
    const im = e.target.closest("img[data-g]"); if (im) openLB(im.dataset.g, im.dataset.i);
  });

  // editing (owner/editors only) → db
  const timers = {};
  function queueSave(docId, data, ssId) {
    clearTimeout(timers[docId]);
    const ss = document.getElementById(ssId); if (ss) ss.textContent = "저장 중…";
    timers[docId] = setTimeout(async () => {
      try { await db.doc("edits/" + docId).set(data); const s2 = document.getElementById(ssId); if (s2) s2.textContent = "저장됨"; }
      catch (err) { const s2 = document.getElementById(ssId); if (s2) s2.textContent = "저장하지 못했어요. 잠시 후 다시 입력해 주세요."; }
    }, 700);
  }
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.sw) { swEdit = swEdit || JSON.parse(JSON.stringify(SW0)); swEdit[t.dataset.sw][t.dataset.k] = t.value; queueSave("software", { sw: swEdit }, "ss-sw"); return; }
    const pid = t.dataset.p; if (!pid || !t.dataset.f) return;
    const base = DATA.flatMap(c => c.projects).find(x => x.id === pid);
    const cur = edits[pid] = edits[pid] || { intro: base.intro, leader: base.leader || "", contrib: JSON.parse(JSON.stringify(base.contrib || [])), client: base.client || "" };
    const f = t.dataset.f;
    if (f === "pct" || f === "detail") {
      let r = cur.contrib.find(x => x.area === t.dataset.a); if (!r) { r = { area: t.dataset.a, pct: "", detail: "" }; cur.contrib.push(r); }
      r[f] = t.value; cur.contrib.sort((a, b) => AREAS.indexOf(a.area) - AREAS.indexOf(b.area));
    } else cur[f] = t.value;
    queueSave(pid, cur, "ss-" + pid);
  });
  function bindEdit() {
    const b = $("#editbtn"); b.hidden = false;
    b.addEventListener("click", () => { edit = !edit; b.setAttribute("aria-pressed", edit); b.textContent = edit ? "편집 끝내기" : "편집"; render(true); });
  }

  shell();
  const h = (location.hash || "").slice(1);
  const hc = DATA.find(c => c.id === h || c.projects.some(p => p.id === h));
  if (h === "about") view = "about"; else if (hc) view = hc.id;
  render();
  if (hc && h !== hc.id) setTimeout(() => { const el = document.getElementById(h); if (el) el.scrollIntoView(); }, 50);
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); const c = DATA.find(x => x.id === v || x.projects.some(p => p.id === v)); if (c && c.id !== view) goCourse(c.id, v !== c.id ? v : null); if (v === "about" && view !== "about") goCourse("about"); });

  if (window.claude && window.claude.use) {
    window.claude.use("db").then(ns => {
      if (!ns) return; db = ns;
      let first = true;
      const t = setTimeout(() => {}, 10000);
      db.collection("edits").onSnapshot(snap => {
        clearTimeout(t);
        snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "software") swEdit = v.sw; else edits[d.id] = v; });
        if (first || !edit) render(true); first = false;
      }, () => {});
    }).catch(() => {});
    window.claude.use("user").then(u => { if (u) u.canEdit().then(ok => { canEdit = ok; if (ok) bindEdit(); }).catch(() => {}); }).catch(() => {});
  }
})();
</script>
